<div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none md:bottom-8 md:right-8"></div>

        </div>

            <a class="font-label-sm text-label-sm text-on-tertiary-container hover:text-primary underline transition-all"
               href="#">API</a>
        </div>
    </div>
</footer>
<script>
    function showToast(message, type = 'info', duration = 4000) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        const isSuccess = type === 'success';
        const isError = type === 'error';
        
        toast.className = `toast pointer-events-auto px-stack-lg py-stack-md rounded-DEFAULT font-body-md text-label-sm flex items-center gap-2 ${
            isSuccess ? 'bg-primary-container text-on-primary-container' :
            isError ? 'bg-error-container text-on-error-container' :
            'bg-surface-container-high text-on-surface'
        }`;
        
        const icon = document.createElement('span');
        icon.className = 'material-symbols-outlined text-[20px] flex-shrink-0';
        icon.textContent = isSuccess ? 'check_circle' : isError ? 'error' : 'info';
        
        const textSpan = document.createElement('span');
        textSpan.textContent = message;
        
        toast.appendChild(icon);
        toast.appendChild(textSpan);
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.classList.add('removing');
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }

    const form = document.getElementById('shortenForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const targetUrl = document.getElementById('targetUrl').value;
        const customCode = document.getElementById('customCode').value;
        const expirationDate = document.getElementById('expirationDate').value;
        const privateLink = document.getElementById('privateLink').checked;

        const payload = {
            target: targetUrl,
            short_code: customCode || undefined,
            expiration: expirationDate || undefined,
            private: privateLink
        };

        try {
            const response = await fetch('/api/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload),
            });

            if (response.ok) {
                const result = await response.json();
                showToast('Link created: ' + result.url, 'success');
                form.reset();
            } else {
                showToast('Error creating link: ' + response.statusText, 'error');
            }
        } catch (error) {
            showToast('Error: ' + error.message, 'error');
        }
    });
</script>
