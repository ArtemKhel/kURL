services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    depends_on:
#      tempo:
#        condition: service_started
#      core:
#        condition: service_started
      - core
      - tempo
    working_dir: /usr/local/bin
#    environment:
#      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config:/usr/local/bin/config:ro
    profiles: ["app"]

  core:
    build:
      context: .
      dockerfile: Dockerfile
      target: core
    restart: unless-stopped
    depends_on:
#      db:
#        condition: service_healthy
#      redis:
#        condition: service_started
#      tempo:
#        condition: service_started
      - db
      - redis
      - tempo
    working_dir: /usr/local/bin
    volumes:
      - ./config:/usr/local/bin/config:ro
    profiles: ["app"]

  analytics:
    build:
      context: .
      dockerfile: Dockerfile
      target: analytics
    restart: unless-stopped
    depends_on:
#      db:
#        condition: service_healthy
#      redis:
#        condition: service_started
#      tempo:
#        condition: service_started
      - db
      - redis
      - tempo
    working_dir: /usr/local/bin
    volumes:
      - ./config:/usr/local/bin/config:ro
    profiles: ["app"]

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # - redis-data:/data
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    profiles: ["infra"]

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kurlyk
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["infra"]

  prometheus:
    image: prom/prometheus:main
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    profiles: ["monitoring"]

  loki:
    image: grafana/loki
    restart: unless-stopped
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    profiles: ["monitoring"]

  alloy:
    image: grafana/alloy
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./config/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # read-only, used only for container log discovery
    command: [ "run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy" ]
    profiles: ["monitoring"]

  tempo:
    image: grafana/tempo
    restart: unless-stopped
    user: "0"
    command: [ "-target=all", "-config.file=/etc/tempo.yaml" ]  # -target=all now required explicitly
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
#    healthcheck:
#      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3200/ready" ]
#      interval: 5s
#      timeout: 3s
#      retries: 5
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:13.1-slim
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3010:3000"  # 3000 is taken by gateway
    profiles: ["monitoring"]

volumes:
  postgres_data:
    name: kurlyk
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
