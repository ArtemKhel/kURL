services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    depends_on:
      core:
        condition: service_started
      alloy:
        condition: service_healthy
    working_dir: /usr/local/bin
    #    environment:
    #      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config:/usr/local/bin/config:ro

  core:
    build:
      context: .
      dockerfile: Dockerfile
      target: core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      alloy:
        condition: service_healthy
    working_dir: /usr/local/bin
    volumes:
      - ./config:/usr/local/bin/config:ro

  analytics:
    build:
      context: .
      dockerfile: Dockerfile
      target: analytics
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      alloy:
        condition: service_healthy
    working_dir: /usr/local/bin
    volumes:
      - ./config:/usr/local/bin/config:ro

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # - redis-data:/data
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]

  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kurlyk
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pg_cron -c cron.database_name=kurlyk"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:main
    restart: unless-stopped
    command: [ "--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-remote-write-receiver" ]
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki
    restart: unless-stopped
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]

  alloy:
    image: grafana/alloy
    restart: unless-stopped
    depends_on:
      - loki
      - tempo
      - prometheus
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # read-only, used only for container log discovery
    command: [ "run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy" ]
    healthcheck:
      #      test: [ "CMD-SHELL", "wget -q --spider http://localhost:12345/-/ready || exit 1" ]
      test: [ "CMD-SHELL", "true" ]
      interval: 5s
      timeout: 3s
      retries: 5

  tempo:
    image: grafana/tempo
    restart: unless-stopped
    user: "0"
    command: [ "-target=all", "-config.file=/etc/tempo.yaml" ]  # -target=all now required explicitly
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:13.1-slim
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3010:3000"  # 3000 is taken by gateway

volumes:
  postgres_data:
    name: kurlyk
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
