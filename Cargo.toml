[workspace]
members = [
    "analytics",
    "common", "core", "gateway", "migrator", "proto"]
resolver = "3"


[workspace.dependencies]
common = { path = "./common" }
proto = { path = "./proto" }

tonic = "0.14.6"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
axum = { version = "0.8.9" }
tower = { version = "0.5.3" }
tower-http = { version = "0.7.0", features = ["trace"] }

redis = { version = "1.3.0", features = ["tokio-comp"] }
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "chrono", "migrate"] }

config = { version = "0.15", default-features = false, features = ["toml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0.18"

tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-opentelemetry = { version = "0.33.0", features = ["metrics"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
opentelemetry = { version = "0.32.0", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.32.0"
