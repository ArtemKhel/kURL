[workspace]
members = ["common", "core", "gateway", "proto"]
resolver = "3"


[workspace.dependencies]
common = { path = "./common" }
proto = { path = "./proto" }

tonic = "0.14.6"
tokio = { version = "1.52.3", features = ["full"] }
tracing = {version = "0.1.44"}
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
