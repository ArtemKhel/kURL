[workspace]
members = [
    "analytics",
    "common", "core", "gateway", "proto"]
resolver = "3"


[workspace.dependencies]
common = { path = "./common" }
proto = { path = "./proto" }

tonic = "0.14.6"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
axum = { version = "0.8.9" }
tower = { version = "0.5.3" }
tower-http = { version = "0.7.0", features = ["trace"] }
redis = { version = "1.3.0", features = ["tokio-comp"] }
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "chrono", "migrate"] }
anyhow = "1.0"
thiserror = "2.0.18"
